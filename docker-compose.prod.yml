services:
  catalog:
    build:
      context: .
    container_name: ms-eventomax-catalog
    mem_limit: 512m
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATASOURCE_HIKARI_SCHEMA: ${DB_SCHEMA:-catalog}
      SPRING_FLYWAY_DEFAULT_SCHEMA: ${DB_SCHEMA:-catalog}
      SPRING_FLYWAY_SCHEMAS: ${DB_SCHEMA:-catalog}
      SPRING_FLYWAY_CREATE_SCHEMAS: ${FLYWAY_CREATE_SCHEMAS:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - eventomax-net
    restart: unless-stopped

networks:
  eventomax-net:
    external: true
