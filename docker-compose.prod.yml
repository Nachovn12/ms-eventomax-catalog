services:
  catalog:
    build:
      context: .
    container_name: ms-eventomax-catalog
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks:
      - eventomax-net
    restart: unless-stopped

networks:
  eventomax-net:
    external: true
